spring.config.import=optional:file:./.env[.properties]
spring.application.name=huellasdeauxilio
server.port=8088
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db_GuardianesDigitales}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Seguridad y JWT

# Configuracion del frontend y URL publica
ip.frontend=${IP_FRONTEND:http://localhost:4200}
app.public-url=${APP_PUBLIC_URL:http://localhost:8088}

# Seguridad JWT - Secreto desde variable de entorno
jwt.secret=${JWT_SECRET}

# HU04 - Recuperacion de contrasena por correo
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Remitente
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# URL para restablecer la contrasena
app.reset-url=${APP_RESET_URL:http://localhost:4200/nueva-contrasena}
