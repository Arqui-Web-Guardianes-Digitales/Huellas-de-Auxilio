# HU04: configuracion SMTP externa (nunca guardar contrasenas ni claves aqui).
# Gmail: smtp.gmail.com:587 y contrasena DE APLICACION, no la contrasena habitual.
# Para Brevo u otro SMTP solo cambiar las variables SMTP_HOST/PORT/USERNAME/PASSWORD.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
# URL del FRONTEND, nunca de la API. HTTPS obligatorio para despliegue publico.
app.reset-url=${APP_RESET_URL:http://localhost:4200/nueva-contrasena}
