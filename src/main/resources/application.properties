spring.application.name=huellasdeauxilio
server.port=8088
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db_GuardianesDigitales}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Seguridad y JWT
ip.frontend=${IP_FRONTEND:http://localhost:4200}
app.public-url=${APP_PUBLIC_URL:http://localhost:8088}
jwt.secret=${JWT_SECRET}
